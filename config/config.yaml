app:
  name: "SAAIA - RAG"
  environment: "local"
  timezone: "Europe/Zurich"

paths:
  documents_root: "C:\\Users\\MBirchler\\Desktop\\ecom\\SAAIA\\GIT\\RAG\\documents"

categories:
  - id: "general"
    label: "Général"
    path: "C:\\Users\\MBirchler\\Desktop\\ecom\\SAAIA\\GIT\\RAG\\documents\\General"
  - id: "atex"
    label: "ATEX"
    path: "C:\\Users\\MBirchler\\Desktop\\ecom\\SAAIA\\GIT\\RAG\\documents\\ATEX"
  - id: "programmation"
    label: "Programmation"
    path: "C:\\Users\\MBirchler\\Desktop\\ecom\\SAAIA\\GIT\\RAG\\documents\\Programmation"

qdrant:
  url: "http://localhost:6333"
  api_key: ""
  collection: "knowledge_base"
  payload_category_field: "category"

llm:
  base_url: "http://localhost:8080"
  model: "mistral-7b"
  temperature: 0.2
  max_tokens: 800
  stream: true
  request_timeout_seconds: 120

embeddings:
  base_url: "http://localhost:8081"
  model: "multilingual-e5-base"
  vector_size: 768

ingestion:
  allowed_extensions: [".pdf", ".docx", ".txt", ".md"]
  chunk_size: 1200
  chunk_overlap: 200
  min_chunk_chars: 200
  max_chunks_per_doc: 500
  compute_file_hash: true

sqlite:
  db_path: "C:\\Users\\MBirchler\\Desktop\\ecom\\SAAIA\\GIT\\RAG\\data\\sessions.db"

api:
  listen_url: "http://localhost:5000"
  cors_allowed_origins:
    - "http://localhost"
    - "app://winui"

logging:
  level: "Information"
  log_to_file: true
  log_path: "C:\\Users\\MBirchler\\Desktop\\ecom\\SAAIA\\GIT\\RAG\\logs\\backend.log"
