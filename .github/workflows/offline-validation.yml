name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SAAIA_TEST_PROFILE: Unit
      DOTNET_NOLOGO: '1'
      # Keep the real bootstrapper, but never wait for a runtime acquisition
      # dialog in a noninteractive test host.
      WindowsAppSDKBootstrapAutoInitializeOptions_None: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Architecture budgets
        shell: pwsh
        run: ./tools/check-architecture.ps1 -OutputPath artifacts/ci/architecture.json
      - name: Behavioral tests for runtime probes
        shell: pwsh
        run: ./tools/testing/Test-RuntimeProbes.ps1 -OutputPath artifacts/ci/runtime-probe-tests.json
      - name: Concurrent runtime-probe readiness publication
        shell: pwsh
        run: ./tools/testing/Test-RuntimeProbeReadiness.ps1 -OutputPath artifacts/ci/runtime-probe-readiness.json
      - name: Offline planning tool contracts without private archives or binaries
        shell: pwsh
        run: ./tools/testing/Test-PlanningOffline.ps1 -OutputDirectory artifacts/ci/planning-tools
      - name: Install exact Docling parser dependency for offline fixture tests
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --no-deps -r infra/docling-sidecar/requirements-parser-tests.txt
      - name: Bounded Docling response transport without models or services
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) 'infra/docling-sidecar'
          $taskLog = 'artifacts/ci/docling-response-spool.log'
          python -B -m unittest discover -s infra/docling-sidecar/tests -p test_response_spool.py -v *> $taskLog
          if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath $taskLog; exit $LASTEXITCODE }
      - name: Deployment build inputs and source archive without services
        shell: pwsh
        run: |
          $taskLog = 'artifacts/ci/deployment-identity.log'
          python -B -m unittest discover -s infra/scripts/prod/tests -p test_deployment_identity.py -v *> $taskLog
          if ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath $taskLog; exit $LASTEXITCODE }
          ./infra/scripts/prod/tests/deployment-contract.tests.ps1 -OutputDirectory artifacts/ci/deployment-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore WinUI test runtime packages
        shell: pwsh
        run: dotnet restore ./client/SAAIA.Client.ToolAgent.Tests/SAAIA.Client.ToolAgent.Tests.csproj
      - name: Register restored WinUI runtime for hosted test user
        shell: pwsh
        run: ./tools/testing/Initialize-HostedWinUiRuntime.ps1 -OutputPath artifacts/ci/winui-runtime.json -Execute
      - name: Offline project suites
        shell: pwsh
        run: ./tools/test-project.ps1 -Profile Unit -OutputPath artifacts/ci/tests/manifest.json
      - name: Test-profile execution and discovery contracts
        shell: pwsh
        run: ./tools/testing/Test-TestProfiles.ps1 -OutputDirectory artifacts/ci/profile-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-validation
          path: artifacts/ci/
