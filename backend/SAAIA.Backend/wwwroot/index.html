<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SAAIA RAG - Dev UI</title>
  <style>
    body { font-family: system-ui, Arial; margin: 0; padding: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid #ddd; display:flex; gap:12px; align-items:center; }
    main { padding: 16px; display:grid; grid-template-columns: 360px 1fr; gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    label { display:block; font-size: 12px; color:#444; margin-top: 10px; }
    input, textarea, button { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
    textarea { height: 120px; }
    button { cursor:pointer; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sources li { margin-bottom: 8px; }
    .muted { color:#666; font-size: 12px; }
    .ok { color: #0a7; font-weight: 600; }
    .bad { color: #c22; font-weight: 600; }
    .snippet { color:#222; font-size: 12px; margin-top:4px; }
  </style>
</head>
<body>
<header>
  <strong>SAAIA RAG — Dev UI</strong>
  <span id="readyBadge" class="muted">/ready: …</span>
  <span class="muted">• POST /rag/search</span>
</header>

<main>
  <section class="card">
    <div class="row">
      <div>
        <label>Category (optionnel)</label>
        <input id="category" value="" />
      </div>
      <div>
        <label>topK</label>
        <input id="topK" type="number" value="5" min="1" max="20" />
      </div>
    </div>

    <label>API Key (X-Api-Key)</label>
    <input id="apiKey" type="password" placeholder="CHANGE_ME_BACKEND_API_KEY" />

    <label>Question</label>
    <textarea id="query">Résume le passage le plus pertinent.</textarea>

    <div class="row" style="margin-top:10px;">
      <button id="sendBtn">Rechercher</button>
      <button id="copyBtn" type="button">Copier JSON</button>
    </div>

    <p class="muted" style="margin-top:10px;">
      Le serveur v2.7 ne génère pas de réponse LLM : il renvoie des chunks sourçables (doc/pages/extrait).
    </p>
  </section>

  <section class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <strong>Résultats</strong>
      <span class="muted" id="status">Idle</span>
    </div>

    <hr />
    <div>
      <strong>Matches</strong>
      <ul class="sources" id="sources"></ul>
    </div>
    <hr />
    <pre id="output"></pre>
  </section>
</main>

<script>
const LS = {
  get: (k, d='') => localStorage.getItem(k) ?? d,
  set: (k, v) => localStorage.setItem(k, v ?? '')
};

function loadSettings() {
  document.getElementById('category').value = LS.get('category', '');
  document.getElementById('topK').value = LS.get('topK', '5');
  document.getElementById('apiKey').value = LS.get('apiKey', '');
  document.getElementById('query').value = LS.get('query', 'Résume le passage le plus pertinent.');
}
function wireAutosave() {
  ['category','topK','apiKey','query'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => LS.set(id, el.value));
  });
}
loadSettings();
wireAutosave();

function setStatus(s) { document.getElementById('status').textContent = s; }
function clearUi() {
  document.getElementById('output').textContent = '';
  document.getElementById('sources').innerHTML = '';
}

async function refreshReady() {
  const badge = document.getElementById('readyBadge');
  try {
    const r = await fetch('/ready');
    const j = await r.json();
    if (r.ok && j.ok) {
      badge.textContent = '/ready: OK';
      badge.className = 'ok';
    } else {
      badge.textContent = '/ready: NOT READY';
      badge.className = 'bad';
    }
  } catch {
    badge.textContent = '/ready: ERROR';
    badge.className = 'bad';
  }
}
setInterval(refreshReady, 4000);
refreshReady();

function renderMatches(matches) {
  const ul = document.getElementById('sources');
  ul.innerHTML = '';
  (matches || []).forEach(m => {
    const li = document.createElement('li');
    const p1 = (m.pageStart ?? '?');
    const p2 = (m.pageEnd ?? '?');
    li.innerHTML = `<div><b>${m.docPath ?? 'unknown'}</b> • p.${p1}-${p2} • chunk ${m.chunkIndex ?? '?'} • score ${(m.score ?? 0).toFixed(3)}</div>`;
    if (m.text) {
      const sn = document.createElement('div');
      sn.className = 'snippet';
      sn.textContent = m.text;
      li.appendChild(sn);
    }
    ul.appendChild(li);
  });
}

async function send() {
  clearUi();
  setStatus('Recherche…');

  const apiKey = document.getElementById('apiKey').value.trim();
  const query = document.getElementById('query').value;
  const categoryRaw = document.getElementById('category').value.trim();
  const topK = Number(document.getElementById('topK').value || 5);

  const payload = {
    query,
    topK,
    ...(categoryRaw ? { category: categoryRaw } : {})
  };

  try {
    const res = await fetch('/rag/search', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(apiKey ? { 'X-Api-Key': apiKey } : {})
      },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    if (!res.ok) {
      setStatus(`HTTP ${res.status}`);
      document.getElementById('output').textContent = text;
      return;
    }

    const obj = JSON.parse(text);
    renderMatches(obj.matches);
    document.getElementById('output').textContent = JSON.stringify(obj, null, 2);
    setStatus(`OK • ${obj.matches?.length ?? 0} match(es)`);

  } catch (e) {
    setStatus('Erreur');
    document.getElementById('output').textContent = String(e);
  }
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = document.getElementById('output').textContent || '';
  try {
    await navigator.clipboard.writeText(text);
    setStatus('Copié ✅');
  } catch {
    setStatus('Copie impossible');
  }
});
</script>
</body>
</html>
