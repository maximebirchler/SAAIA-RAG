<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SAAIA RAG - Dev UI</title>
  <style>
    body { font-family: system-ui, Arial; margin: 0; padding: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid #ddd; display:flex; gap:12px; align-items:center; }
    main { padding: 16px; display:grid; grid-template-columns: 360px 1fr; gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    label { display:block; font-size: 12px; color:#444; margin-top: 10px; }
    input, textarea, button { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
    textarea { height: 120px; }
    button { cursor:pointer; }
    pre { white-space: pre-wrap; word-wrap: break-word; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sources li { margin-bottom: 6px; }
    .muted { color:#666; font-size: 12px; }
    .ok { color: #0a7; font-weight: 600; }
    .bad { color: #c22; font-weight: 600; }
  </style>
</head>
<body>
<header>
  <strong>SAAIA RAG — Dev UI</strong>
  <span id="readyBadge" class="muted">/ready: …</span>
  <span class="muted">• SSE POST /chat/stream</span>
</header>

<main>
  <section class="card">
    <div class="row">
      <div>
        <label>Category</label>
        <input id="category" value="programmation" />
      </div>
      <div>
        <label>topK</label>
        <input id="topK" type="number" value="3" min="0" max="10" />
      </div>
    </div>

    <label>API Key (X-Api-Key)</label>
    <input id="apiKey" type="password" placeholder="CHANGE_ME_BACKEND_API_KEY" />

    <label>Question</label>
    <textarea id="query">Résume clairement le passage et termine par les citations</textarea>

    <label>System prompt (override)</label>
    <textarea id="systemPrompt" placeholder="Ex: Réponds en 5 points, très court, et termine par citations."></textarea>

    <div class="row" style="margin-top:10px;">
      <button id="sendBtn">Envoyer</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>

    <p class="muted" style="margin-top:10px;">
      Astuce : mets topK=0 pour tester LLM seul.
    </p>
  </section>

  <section class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <strong>Réponse</strong>
      <div style="display:flex; gap:10px; align-items:center;">
        <button id="copyBtn" type="button" style="width:auto; padding:6px 10px;">Copier</button>
        <span class="muted" id="status">Idle</span>
      </div>
    </div>

    <hr />
    <div>
      <strong>Sources (meta)</strong>
      <ul class="sources" id="sources"></ul>
    </div>
    <hr />
    <pre id="output"></pre>
  </section>
</main>

<script>
let currentAbort = null;
let gotFirstDelta = false;
let ttftMs = null;
let t0 = 0;

const LS = {
  get: (k, d='') => localStorage.getItem(k) ?? d,
  set: (k, v) => localStorage.setItem(k, v ?? '')
};

function loadSettings() {
  document.getElementById('category').value = LS.get('category', 'programmation');
  document.getElementById('topK').value = LS.get('topK', '3');
  document.getElementById('apiKey').value = LS.get('apiKey', '');
  document.getElementById('query').value = LS.get('query', 'Résume clairement le passage et termine par les citations');
  const spEl = document.getElementById('systemPrompt');
  if (spEl) spEl.value = LS.get('systemPrompt', '');
}

function wireAutosave() {
  const ids = ['category','topK','apiKey','query','systemPrompt'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => LS.set(id, el.value));
  });
}

loadSettings();
wireAutosave();

async function refreshReady() {
  const badge = document.getElementById('readyBadge');
  try {
    const r = await fetch('/ready');
    const j = await r.json();
    if (r.ok && j.ok) {
      badge.textContent = '/ready: OK';
      badge.className = 'ok';
    } else {
      badge.textContent = '/ready: NOT READY';
      badge.className = 'bad';
    }
  } catch {
    badge.textContent = '/ready: ERROR';
    badge.className = 'bad';
  }
}
setInterval(refreshReady, 4000);
refreshReady();

function setStatus(s) { document.getElementById('status').textContent = s; }
function clearUi() {
  document.getElementById('output').textContent = '';
  document.getElementById('sources').innerHTML = '';
}

function renderSources(meta) {
  const ul = document.getElementById('sources');
  ul.innerHTML = '';

  // Infos de sélection (si fournies)
  if (meta.retrieval) {
    const li = document.createElement('li');
    const r = meta.retrieval;
    li.textContent = `Retrieval: confidence=${r.confidence} • bestScore=${(r.bestScore ?? 0).toFixed(3)} • gap=${(r.scoreGap ?? 0).toFixed(3)} • selected=${r.selectedK}/${r.candidateK}`;
    ul.appendChild(li);
  }

  (meta.sources || []).forEach(s => {
    const li = document.createElement('li');
    li.textContent = `[${s.sourceId}] ${s.docName} (p.${s.pageStart}-${s.pageEnd}, chunk ${s.chunkIndex}) score=${(s.score ?? 0).toFixed(3)}`;
    ul.appendChild(li);
  });
}

function handleSseEvent(eventName, dataObj) {
  if (eventName === 'meta') { renderSources(dataObj); return; }
  if (eventName === 'delta') {
    if (!gotFirstDelta) {
      gotFirstDelta = true;
      ttftMs = Math.round(performance.now() - t0);
      setStatus(`Streaming… TTFT ${ttftMs} ms`);
    }
    document.getElementById('output').textContent += (dataObj.content || '');
    return;
  }
  if (eventName === 'done') { setStatus('Done'); return; }
}

function parseSseBlock(block) {
  if (!block || block.startsWith(':')) return; // ignore ping/comments
  const lines = block.split('\n');
  let eventName = 'message';
  let dataLine = '';
  for (const ln of lines) {
    if (ln.startsWith('event:')) eventName = ln.slice(6).trim();
    if (ln.startsWith('data:')) dataLine += ln.slice(5).trim();
  }
  if (!dataLine) return;
  let obj;
  try { obj = JSON.parse(dataLine); }
  catch {
    document.getElementById('output').textContent += `\n[parse error] ${dataLine}\n`;
    return;
  }
  try { handleSseEvent(eventName, obj); }
  catch (e) {
    console.error(e);
    setStatus('UI error (console)');
  }
}

async function send() {
  clearUi();
  setStatus('Streaming...');

  const apiKey = document.getElementById('apiKey').value.trim();
  const query = document.getElementById('query').value;
  const category = document.getElementById('category').value.trim();
  const topK = Number(document.getElementById('topK').value || 0);
  const systemPrompt = (document.getElementById('systemPrompt')?.value || '').trim();

  const payload = systemPrompt ? { query, category, topK, systemPrompt } : { query, category, topK };

  currentAbort = new AbortController();
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;

  t0 = performance.now();
  ttftMs = null;
  gotFirstDelta = false;

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(apiKey ? { 'X-Api-Key': apiKey } : {})
      },
      body: JSON.stringify(payload),
      signal: currentAbort.signal
    });

    if (!res.ok) {
      setStatus(`HTTP ${res.status}`);
      document.getElementById('output').textContent = await res.text();
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');

      // SSE events separated by blank line
      let idx;
      while ((idx = buffer.indexOf('\n\n')) >= 0) {
        const block = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 2);
        parseSseBlock(block);
      }
    }

    const totalMs = Math.round(performance.now() - t0);
    if (ttftMs === null) setStatus(`Done • Total ${totalMs} ms`);
    else setStatus(`Done • TTFT ${ttftMs} ms • Total ${totalMs} ms`);

  } catch (e) {
    if (e.name === 'AbortError') setStatus('Stopped');
    else setStatus('Error');
  } finally {
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    currentAbort = null;
  }
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('stopBtn').addEventListener('click', () => currentAbort?.abort());
document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = document.getElementById('output').textContent || '';
  try {
    await navigator.clipboard.writeText(text);
    setStatus('Copié ✅');
  } catch {
    setStatus('Copie impossible');
  }
});
</script>
</body>
</html>
