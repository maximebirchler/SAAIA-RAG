name: saaia-rag

services:
  postgres:
    image: postgres:16-alpine
    container_name: saaia-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: saaia-rag-qdrant
    environment:
      TZ: ${TZ}
      # Optionnel : active une API key Qdrant (si tu veux durcir).
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    # Port exposé uniquement sur localhost (pas public)
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    container_name: saaia-rag-embeddings
    volumes:
      - tei_data:/data
    command:
      - --model-id
      - ${TEI_MODEL_ID}
      - --auto-truncate
    # Port exposé uniquement sur localhost (pas public)
    ports:
      - "127.0.0.1:${TEI_HOST_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_storage:
  tei_data:
