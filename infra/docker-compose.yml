name: saaia-rag

services:
  postgres:
    image: postgres:16-alpine
    container_name: saaia-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: saaia-rag-qdrant
    environment:
      TZ: ${TZ}
      # Optionnel : active une API key Qdrant (si tu veux durcir).
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    # Port exposé uniquement sur localhost (pas public)
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    container_name: saaia-rag-embeddings
    volumes:
      - tei_data:/data
    command:
      - --model-id
      - ${TEI_MODEL_ID}
      - --auto-truncate
    # Port exposé uniquement sur localhost (pas public)
    ports:
      - "127.0.0.1:${TEI_HOST_PORT:-8081}:80"
    restart: unless-stopped

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    gpus: all
    container_name: saaia-rag-llama
    volumes:
      - ../models:/models:ro

    environment:
      # Variables NVidia
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      #Offload GPU
      LLAMA_ARG_N_GPU_LAYERS: ${LLM_N_GPU_LAYERS:-all}

      # Chat template / jinja
      LLAMA_ARG_CHAT_TEMPLATE: ${LLM_CHAT_TEMPLATE:-chatml}
      LLAMA_ARG_JINJA: ${LLM_JINJA:-1}

      # Flash attention (si instable -> 0)
      LLAMA_ARG_FLASH_ATTN: ${LLM_FLASH_ATTN:-1}


      # Fichier GGUF présent dans ../models
      # (compat: LLM_MODEL_FILE prioritaire, sinon LLM_MODEL)
      LLAMA_ARG_MODEL: /models/${LLM_MODEL_FILE:-${LLM_MODEL}}

      # Contrainte 16GB RAM : valeurs "safe" par défaut
      LLAMA_ARG_CTX_SIZE: ${LLM_CTX_SIZE:-4096}
      LLAMA_ARG_N_PARALLEL: ${LLM_N_PARALLEL:-1}

      # API OpenAI-compatible sur 8080 dans le conteneur
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080

      # IMPORTANT: alias OpenAI "model" attendu par le backend
      LLAMA_ARG_ALIAS: ${LLM_MODEL_ID:-local}

      # Optionnel (CPU) : ajuste selon ta machine
      LLAMA_ARG_THREADS: ${LLM_THREADS:-6}
      LLAMA_ARG_THREADS_BATCH: ${LLM_THREADS_BATCH:-${LLM_THREADS:-6}}
      LLAMA_ARG_BATCH: ${LLM_BATCH:-512}

      # Optionnel : endpoint métriques
      LLAMA_ARG_ENDPOINT_METRICS: ${LLM_METRICS:-1}
    # Port exposé uniquement sur localhost, sur 1234 pour compat avec tes tests
    ports:
      - "127.0.0.1:${LLM_HOST_PORT:-1234}:8080"
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_storage:
  tei_data:
