name: saaia-llm

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: saaia-llama
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


    volumes:
      - ../models:/models:ro

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      # --- Model ---
      LLAMA_ARG_MODEL: /models/Mistral-7B-Instruct-v0.3-IQ3_M.gguf

      # --- Perf (safe defaults for 16GB RAM) ---
      LLAMA_ARG_CTX_SIZE: 3072
      LLAMA_ARG_N_PARALLEL: 1
      LLAMA_ARG_THREADS: 6
      LLAMA_ARG_THREADS_BATCH: 6
      LLAMA_ARG_BATCH: 256

      # --- GPU offload ---
      # Mets "all" si ça passe. Sinon baisse (voir notes plus bas).
      LLAMA_ARG_N_GPU_LAYERS: all

      # --- OpenAI compat server ---
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080

    ports:
      - "127.0.0.1:1234:8080"

    restart: unless-stopped
