name: saaia-llm

services:
  llama:
    image: saaia/llama.cpp:server-cuda-b10098
    container_name: saaia-llama
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


    volumes:
      - ../models:/models:ro

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      # --- Model ---
      LLAMA_ARG_MODEL: /models/Qwen_Qwen3-4B-Instruct-2507-Q5_K_M.gguf

      # --- Perf (safe defaults for 16GB RAM) ---
      LLAMA_ARG_CTX_SIZE: 4096
      LLAMA_ARG_N_PARALLEL: 1
      LLAMA_ARG_THREADS: 6
      LLAMA_ARG_THREADS_BATCH: 6
      LLAMA_ARG_BATCH: 512
      LLAMA_ARG_UBATCH: 128

      # --- GPU offload ---
      # Mets "all" si ça passe. Sinon baisse (voir notes plus bas).
      LLAMA_ARG_N_GPU_LAYERS: all
      LLAMA_ARG_JINJA: true
      LLAMA_ARG_REASONING: off

      # --- OpenAI compat server ---
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080

    ports:
      - "127.0.0.1:1234:8080"

    restart: unless-stopped

    networks:
      - backend

networks:
  backend:
    name: ${SAAIA_LLM_DOCKER_NETWORK:-infra_default}
    external: true
